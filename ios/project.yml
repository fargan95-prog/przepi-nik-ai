name: PrzepisnikAI
options:
  bundleIdPrefix: com.fargan95
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  PrzepisnikAI:
    type: application
    platform: iOS
    sources:
      - path: PrzepisnikAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fargan95.przepisnikai
        INFOPLIST_KEY_CFBundleDisplayName: Przepiśnik AI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: PrzepisnikAI/PrzepisnikAI.entitlements
    entitlements:
      path: PrzepisnikAI/PrzepisnikAI.entitlements
  PrzepisnikShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PrzepisnikShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fargan95.przepisnikai.share
        INFOPLIST_FILE: PrzepisnikShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: PrzepisnikShare/PrzepisnikShare.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: PrzepisnikAI

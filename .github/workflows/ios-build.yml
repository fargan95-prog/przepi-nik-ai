name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "native-backend/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift parser
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Parse Swift source files
        run: |
          swiftc -frontend -parse ios/PrzepisnikAI/PrzepisnikAIApp.swift
          swiftc -frontend -parse ios/PrzepisnikAI/RecipeHomeView.swift
          swiftc -frontend -parse ios/PrzepisnikShare/ShareViewController.swift
      - name: Check backend JavaScript syntax
        run: node --check native-backend/server.js

  ios-build:
    needs: source-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Parse Swift sources
        run: |
          swiftc -frontend -parse ios/PrzepisnikAI/PrzepisnikAIApp.swift
          swiftc -frontend -parse ios/PrzepisnikAI/RecipeHomeView.swift
          swiftc -frontend -parse ios/PrzepisnikShare/ShareViewController.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/PrzepisnikAI.xcodeproj \
            -scheme PrzepisnikAI \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
